[project]
name = "EvernightAI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "pyright",
    "openai",
    "uvicorn[standard]",
    "pyjwt[crypto]>=2.13.0",
    "cryptography",
    "ruff",
    "mcp>=1.0,<2",
]

[project.scripts]
evernight = "EvernightAI.entrypoint.cli:main"
evernight-http = "EvernightAI.entrypoint.server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["EvernightAI*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["workspaces", ".git", ".venv", "node_modules"]
addopts = [
    "-ra",
]
markers = [
    "sandbox: OS-level Bubblewrap isolation tests, run outside an existing process sandbox",
    "real_images: tests that call a real image generation provider (may incur charges)",
    "real_openai: tests that call a real OpenAI-compatible provider",
    "real_openai_responses: tests that call a real OpenAI Responses provider",
    "real_gemini: tests that call a real Gemini provider",
    "real_anthropic: tests that call a real Anthropic provider",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "src/EvernightAI",
]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
