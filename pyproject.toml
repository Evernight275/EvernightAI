[project]
name = "EvernightAI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "pyright",
    "openai",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["EvernightAI*"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
]
markers = [
    "real_openai: tests that call a real OpenAI-compatible provider",
]

[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
