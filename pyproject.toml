[project]
name = "EvernightAI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "pyright",
    "openai",
    "uvicorn",
    "pyjwt[crypto]>=2.13.0",
]

[project.scripts]
evernight = "EvernightAI.entrypoint.cli:main"
evernight-http = "EvernightAI.entrypoint.server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["EvernightAI*"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
]
markers = [
    "real_openai: tests that call a real OpenAI-compatible provider",
    "real_openai_responses: tests that call a real OpenAI Responses provider",
    "real_gemini: tests that call a real Gemini provider",
    "real_anthropic: tests that call a real Anthropic provider",
]

[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
