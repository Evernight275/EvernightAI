name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and type check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Run tests on Linux
        if: runner.os != 'Windows'
        run: ./.venv/bin/python -m pytest

      - name: Run pyright on Windows
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\pyright.exe

      - name: Run pyright on Linux
        if: runner.os != 'Windows'
        run: ./.venv/bin/pyright
